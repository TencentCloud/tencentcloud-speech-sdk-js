<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>实时语音识别2.0 Demo</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
<div class="page">
    <div class="card main-card">
        <div class="main-left">
            <h2 class="title">实时语音识别2.0</h2>
            <div class="btn-group">
                <button class="btn btn-primary" id="start">开始识别</button>
                <button class="btn btn-danger display-none" id="end">结束识别</button>
            </div>
            <div class="status display-none" id="connecting">
                <span class="dot dot-pulse"></span> 建立连接中...
            </div>
            <div class="status display-none" id="recognizing">
                <span class="dot dot-green"></span> 识别中
            </div>
        </div>
        <div class="main-right">
            <div id="recognizeText" class="recognize-content"></div>
        </div>
    </div>
</div>
<script src="lib/jquery.js"></script>
<script src="../dist/speechrecognizerv2.js"></script>
<script src="config.js"></script>
<script src="asrauthentication.js"></script>
<script type="module" src="speechrecognizerv2.js"></script>
</body>
</html>
